pulse:
  name: Pulse
  description: >
    Active un relais ALLIN I/O 8 pendant une durée définie, puis le désactive.
    Utile pour les marches électriques, gâches, klaxons ou tout équipement
    nécessitant une impulsion temporisée.
  fields:
    entity_id:
      name: Relais
      description: Entité switch ALLIN à activer en impulsion.
      required: true
      selector:
        entity:
          domain: switch
          integration: allin_io_8
    duration:
      name: Durée
      description: Durée d'activation en secondes (0.1 à 60).
      default: 1.0
      example: 2.5
      required: false
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.1
          unit_of_measurement: s
          mode: slider
